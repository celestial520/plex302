[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
loglevel=info

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_WEBUI_PORT)s --log-level warning
directory=/app
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
