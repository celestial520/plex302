[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
loglevel=info

[program:web]
# 用 python -m 启动：sys.path[0] 才是工作目录，否则找不到 app 包
command=/opt/venv/bin/python -m uvicorn app.main:app --app-dir /app --host 0.0.0.0 --port %(ENV_WEBUI_PORT)s --log-level warning
directory=/app
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
