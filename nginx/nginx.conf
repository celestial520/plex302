load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user  root;
worker_processes  auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
# 同时输出到 stderr：njs 的 [Plex302] 决策日志能直接出现在 docker logs 里
# （对齐 plex-demo 的 "docker logs ... | grep js:"）
error_log stderr warn;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 302 决策日志：每次 302 / 回源留一行，WebUI 日志页会读它。
    # v1.7 把缓存上移到 nginx 后，命中缓存的 302 不再经过 Python，
    # 只有这份 nginx 日志能完整记录「哪次播放真的 302 了」。
    log_format  p302  '$time_local|$remote_addr|$status|$sent_http_x_plex302'
                      '|$sent_http_x_plex302_reason|$request_uri';

    access_log  /var/log/nginx/access.log  main;
    access_log  /var/log/nginx/302.log  p302;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 0;

    gzip on;
    gzip_min_length 1100;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
