name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先在本机把镜像跑起来，确认容器能启动、nginx 配置和 njs 模块没问题，
  # 再推多架构镜像。冒烟不过就不发布，避免把坏镜像推给用户。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64, 本地加载)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plex302:smoke

      - name: 启动容器
        run: |
          set -e
          mkdir -p "${PWD}/smoke-config"
          docker run -d --name p302 \
            --add-host host.docker.internal:host-gateway \
            -e TZ=Asia/Shanghai \
            -e P115_WEBAPI_BASE=http://host.docker.internal:32403 \
            -e P115_EVENT_BASE=http://host.docker.internal:32403 \
            -e NGINX_PORT=32500 \
            -e WEBUI_PORT=999 \
            -p 32500:32500 -p 999:999 \
            -v "${PWD}/smoke-config:/config" \
            plex302:smoke

      - name: 等待 WebUI 就绪
        run: |
          set -e
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:999/login || true)
            if [ "$code" = "200" ]; then
              echo "WebUI 就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::WebUI 在 90 秒内没有就绪"
          docker logs p302 || true
          exit 1

      - name: 接口断言
        run: |
          set -e
          web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:999/login)
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:999/api/status)
          plex=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:32500/identity)
          part=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:32500/library/parts/123/1/a.mkv)
          echo "WebUI 登录页=$web 状态接口(未登录)=$api Plex 代理(无 Plex)=$plex 播放拦截(无 Plex)=$part"
          # 502 说明 nginx 已经去连 Plex 但连不上，即 njs 正常跑完并走了回源分支；
          # 如果 njs 抛异常这里会是 500。
          [ "$web" = "200" ] || { echo "::error::登录页不是 200"; exit 1; }
          [ "$api" = "401" ] || { echo "::error::未登录访问 /api/status 应为 401"; exit 1; }
          [ "$plex" = "502" ] || { echo "::error::Plex 代理应回源失败 502"; exit 1; }
          [ "$part" = "502" ] || { echo "::error::播放拦截在无 Plex 时应 502（500 代表 njs 异常）"; exit 1; }

      - name: 端到端 302（假 Plex + 假直链）
        run: |
          set -e
          # 用 docker0 网桥网关 IP（172.17.0.1），不是 runner 的默认路由；
          # 另外 nginx 的 proxy_pass 走自己配的 resolver，不读 /etc/hosts，所以只能用 IP
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "网桥网关=$GW"
          python3 tests/mock_plex.py --host 0.0.0.0 --port 32401 --cdn-port 32402 &
          sleep 2

          # 先确认容器能访问宿主机上的假 Plex，避免后面排错困难
          docker exec p302 curl -fsS -m 5 "http://$GW:32401/identity" > /dev/null \
            || { echo "::error::容器访问不到宿主机 $GW:32401"; exit 1; }

          # 登录拿 cookie，把 Plex 指向假 Plex，直链走自定义接口
          curl -s -c cookie.txt -X POST -H 'Content-Type: application/json' \
            -d '{"password":"admin"}' http://127.0.0.1:999/api/login
          curl -s -b cookie.txt http://127.0.0.1:999/api/config > cfg.json

          GW="$GW" python3 - <<'PY'
          import json, os
          cfg = json.load(open("cfg.json"))["data"]
          cfg["plex"]["url"] = f"http://{os.environ['GW']}:32401"
          cfg["plex"]["token"] = "mock"
          cfg["provider"]["type"] = "custom"
          cfg["provider"]["custom_url"] = f"http://{os.environ['GW']}:32402/link"
          cfg["mounts"] = [{"name": "CD2", "plex_prefix": "/mnt/cd2/115", "cloud_prefix": "/", "cd2_prefix": ""}]
          cfg["u115"]["cookie"] = "UID=ci; CID=ci; SEID=ci"
          cfg["u115"]["recent_limit"] = 20
          # 测试里把静置时间压到 0，否则要等两分钟才能看到入队；
          # 后台轮询间隔拉长到 1 小时，避免它和手动触发抢事件影响断言
          cfg["events"]["interval"] = 3600
          cfg["events"]["settle_seconds"] = 0
          cfg["events"]["verify_enabled"] = False
          cfg["scan"]["full_on_start"] = False
          json.dump(cfg, open("cfg2.json", "w"))
          PY

          curl -s -b cookie.txt -X POST -H 'Content-Type: application/json' \
            --data-binary @cfg2.json http://127.0.0.1:999/api/config
          echo
          sleep 4  # 等 njs 热加载 runtime.json

          echo "--- 外网请求应 302 到直链 ---"
          curl -s -D headers.txt -o /dev/null -H 'X-Forwarded-For: 8.8.8.8' \
            'http://127.0.0.1:32500/library/parts/123/1/file.mkv'
          grep -iE '^(HTTP/1.1 302|Location:|X-Plex302:)' headers.txt || { echo "::error::外网请求没有返回 302"; cat headers.txt; exit 1; }
          grep -qi 'dune.mkv' headers.txt || { echo "::error::Location 不是直链"; exit 1; }

          echo "--- 内网请求应回源 Plex ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 192.168.1.9' \
            'http://127.0.0.1:32500/library/parts/123/1/file.mkv')
          echo "内网状态码=$code"
          [ "$code" = "200" ] || { echo "::error::内网应回源 200"; exit 1; }

          echo "--- 115 操作事件 -> 增量入库 ---"
          python3 tests/mock_115.py --host 0.0.0.0 --port 32403 > /tmp/mock115.log 2>&1 &
          sleep 2
          cat /tmp/mock115.log
          mock=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H 'Cookie: UID=ci; SEID=ci' \
            'http://127.0.0.1:32403/behavior/detail?limit=1')
          echo "mock 115 HTTP=$mock"
          [ "$mock" = "200" ] || { echo "::error::假 115 没起来"; exit 1; }

          # 第一轮：建立游标（首次运行只记录，不补扫历史）
          first=$(curl -s -m 30 -b cookie.txt -X POST -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:999/api/115/events/run)
          echo "第一轮 $first"
          echo "$first" | grep -q '"queued": *0' || { echo "::error::首次运行不应立刻入队扫描"; exit 1; }

          # 造一条“上传电视剧文件”的事件（parent 2002 = /电视剧/测试剧）
          curl -s -m 5 -X POST -H 'Content-Type: application/json' \
            -d '{"id":"1001","type":2,"file_id":"9100","file_name":"S01E01.mkv","parent_id":"2002","sha1":"cisha1","file_size":104857600}' \
            http://127.0.0.1:32403/add_event > /dev/null

          # 第二轮：事件被消费 -> 静置 0 秒 -> 立刻入队
          second=$(curl -s -m 30 -b cookie.txt -X POST -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:999/api/115/events/run)
          echo "第二轮 $second"
          echo "$second" | grep -q '"queued": *1' || { echo "::error::115 操作事件没有入队扫描"; exit 1; }

          # 第三轮：游标已推进，不应重复入队
          third=$(curl -s -m 30 -b cookie.txt -X POST -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:999/api/115/events/run)
          echo "第三轮 $third"
          echo "$third" | grep -q '"new": *0' || { echo "::error::游标没有推进，事件被重复消费"; exit 1; }
          echo "$third" | grep -q '"queued": *0' || { echo "::error::重复事件又被扫了一次"; exit 1; }

          sleep 3
          curl -s -m 10 -b cookie.txt 'http://127.0.0.1:999/api/scan/history?limit=5' | grep -q '115event' \
            || { echo "::error::扫描记录里没有 115event 来源"; exit 1; }

          echo "--- 全量同步：Plex 整库扫描 ---"
          full=$(curl -s -m 60 -b cookie.txt -X POST http://127.0.0.1:999/api/sync/full)
          echo "触发 $full"
          for i in $(seq 1 20); do
            body=$(curl -s -m 10 -b cookie.txt http://127.0.0.1:999/api/sync/full)
            echo "第 ${i} 次查询 $body"
            echo "$body" | grep -q '"running": *false' && break
            sleep 3
          done
          echo "$body" | grep -q '"done": *2' || { echo "::error::全量同步没有扫完两个媒体库"; exit 1; }

          echo "--- CMS 对接：Emby 兼容入口 ---"
          key=$(curl -s -b cookie.txt http://127.0.0.1:999/api/status | python3 -c 'import sys,json,urllib.parse;print(urllib.parse.parse_qs(urllib.parse.urlparse(json.load(sys.stdin)["data"]["emby_url"]).query)["api_key"][0])')
          echo "emby api_key=$key"
          noauth=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:999/emby/System/Info)
          info=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "http://127.0.0.1:999/emby/System/Info?api_key=$key")
          refresh=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST "http://127.0.0.1:999/emby/Library/Refresh?api_key=$key")
          echo "无 token=$noauth 有 token=$info 刷新=$refresh"
          [ "$noauth" = "401" ] || { echo "::error::Emby 入口没有校验 api_key"; exit 1; }
          [ "$info" = "200" ] || { echo "::error::Emby System/Info 不通"; exit 1; }
          [ "$refresh" = "204" ] || { echo "::error::Emby Library/Refresh 应返回 204"; exit 1; }

      - name: 输出日志
        if: always()
        run: |
          docker logs p302 2>&1 | tail -50 || true
          echo "--- runtime.json ---"
          cat smoke-config/runtime.json 2>/dev/null || true

      - name: 清理
        if: always()
        run: docker rm -f p302 || true

  docker:
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
